<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827"><title>FE Knowledge Engine</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#edf2fa;background:#0c1220}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:23px;margin:4px 0 6px}.muted{color:#9db0ca;font-size:13px}.panel{background:#172237;border:1px solid #2b3c56;border-radius:19px;padding:20px;margin-top:18px}.tag{display:inline-block;border-radius:999px;background:#263d59;padding:6px 10px;color:#bdd8ff;font-size:12px}button,a.btn{cursor:pointer;border:1px solid #446083;border-radius:11px;padding:11px 13px;background:#233651;color:white;text-decoration:none;font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:hover,a.btn:hover{background:#304c70}button.primary{background:#4169df;border-color:#4169df}button.good{border-color:#3bb88c}button.bad{border-color:#ef8484}button:disabled{opacity:.45;cursor:default}.flex{display:flex;gap:10px;flex-wrap:wrap}.two>*{flex:1}#term{font-size:25px;margin:18px 0 6px}#statement{font-size:18px;line-height:1.65}.hidden{display:none}.result{padding:12px;background:#22334d;border-radius:12px;margin:12px 0}.section{margin:15px 0;padding-left:13px;border-left:3px solid #6e9eff;line-height:1.7}.section b{display:block;color:#bed5ff}#stats{font-size:13px;color:#aabddd}select{font:inherit;background:#20314b;color:white;padding:10px;border:1px solid #4b6485;border-radius:10px;max-width:100%}.actions{margin-top:15px}.footer{margin-top:18px;font-size:12px;color:#91a4c0}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e4f1ff;color:#111f35;border-radius:9px;padding:9px 15px;display:none}</style></head><body><div class="wrap"><header><div><div class="muted">基本情報技術者試験 / 科目A</div><h1>FE Knowledge Engine</h1><div class="muted">正誤の先にある「なぜ」を理解する。</div></div><span class="tag">○× 一問一答</span></header><section class="panel"><div class="flex" style="align-items:center;justify-content:space-between"><label>分野 <select id="filter"><option value="all">全分野</option><option value="technology">テクノロジ</option><option value="management">マネジメント</option><option value="strategy">ストラテジ</option><option value="wrong">間違えた問題を復習</option></select></label><span id="stats"></span></div><div class="flex" style="justify-content:space-between;align-items:center;margin-top:18px"><span class="tag" id="category"></span><button id="copyQuestion">問題をコピー</button></div><h2 id="term"></h2><div id="statement"></div><p class="muted">この文章は正しい？</p><div class="flex two" id="answers"><button class="good" data-val="true">○ 正しい</button><button class="bad" data-val="false">× 誤り</button></div><div id="result" class="result hidden"></div><div id="details" class="hidden"><h3>「なぜ」を理解する解説</h3><div class="section"><b>① 原理・原則</b><span id="principle"></span></div><div class="section"><b>② 因果関係・理屈</b><span id="logic"></span></div><div class="section"><b>③ ケーススタディ</b><span id="case"></span></div><div class="section"><b>④ 応用・条件が変わると？</b><span id="application"></span></div><div class="flex actions"><button id="copyExplain">解説をコピー</button><button id="copyAll">問題＋解説をコピー</button></div></div><div class="flex actions"><button class="primary" id="next" disabled>次の問題へ →</button><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">チャッピーに質問 ↗</a></div></section><div class="footer">端末内に回答履歴を保存します。インターネット接続不要で問題を解けます（ChatGPTリンクは通信が必要です）。収録問題は試作用のオリジナル問題です。</div></div><div id="toast" role="status"></div><script>
const questions=[
{term:'キャッシュメモリ',category:'technology',label:'テクノロジ / ハードウェア',statement:'キャッシュメモリは、CPUと主記憶装置のアクセス速度の差による待ち時間を減らすために用いられる。',correct:true,principle:'CPUが処理するには命令やデータの読み出しが必要だが、記憶装置ごとにアクセス速度は違う。',logic:'主記憶へのアクセスでCPUが待つことがある。よく使うデータを高速なキャッシュに保持しておくと、主記憶へのアクセスを減らせる。',case:'ゲームの物理演算などで同じデータを繰り返し使うとき、データがキャッシュにあれば短い時間で取り出せる。',application:'キャッシュが大きいほど必ず速いわけではない。ヒット率・アクセス時間・処理するデータの性質が影響する。'},
{term:'RAM',category:'technology',label:'テクノロジ / ハードウェア',statement:'一般的なRAMは、電源を切っても記憶内容を保持する不揮発性メモリである。',correct:false,principle:'一般的な主記憶で用いられるDRAMは、記憶内容の保持に電力を必要とする。',logic:'電源供給が止まると記憶のための電気的状態を保てず、データが消える。したがって、一般的なRAMは揮発性メモリに分類される。',case:'作業中の文章を保存せずにPCの電源を落とすと、メモリ上にしかなかった編集内容は失われる場合がある。',application:'SSDやフラッシュメモリは不揮発性。なお、RAMという語はランダムアクセスの性質を指し、すべてのRAMが原理上必ず揮発性という意味ではない。'},
{term:'DNS',category:'technology',label:'テクノロジ / ネットワーク',statement:'DNSは、ドメイン名から対応するIPアドレスを調べる用途に使われる。',correct:true,principle:'ネットワーク通信では宛先を識別するIPアドレスが使われる一方、人は覚えやすい名前を使いたい。',logic:'DNSはドメイン名とレコードを対応付け、名前からIPアドレスを得られるようにする。',case:'ブラウザにWebサイトのドメイン名を入力したとき、DNSによって接続先のIPアドレスを取得することがある。',application:'DNSにはMXやTXTなどIPアドレス以外の情報もある。DNSがWeb通信そのものを運ぶわけではない。'},
{term:'主キー',category:'technology',label:'テクノロジ / データベース',statement:'リレーショナルデータベースの主キーには、同じ値を持つ行が複数存在してよい。',correct:false,principle:'表の各行を確実に識別するには、行ごとに異なる識別子が必要になる。',logic:'主キーに重複が許されると、同じキーで複数行が該当し、どの行か一意に特定できない。このため主キーは一意でありNULLも許されない。',case:'会員テーブルで会員IDを主キーにすると、同じ会員IDの別会員を誤って登録することを防げる。',application:'氏名は同姓同名があり、主キーに向かないことが多い。複数列を組み合わせた複合主キーもある。'},
{term:'クリティカルパス',category:'management',label:'マネジメント / プロジェクト',statement:'クリティカルパス上の作業が遅れると、他で時間短縮しない限りプロジェクト全体の完了も遅れる。',correct:true,principle:'プロジェクトでは作業間に前後関係があり、並行できる作業とできない作業がある。',logic:'完了までの所要時間を決める最長経路がクリティカルパス。経路上の作業には通常余裕時間がないため、遅れが全体日程に影響する。',case:'設計→実装→試験が最長経路なら、設計の遅れが実装・試験に連鎖する。',application:'人員追加や後工程の短縮、作業順序の見直しなどで全体の遅れを補える場合もある。'},
{term:'損益分岐点',category:'strategy',label:'ストラテジ / 経営',statement:'損益分岐点売上高は、売上高と総費用が一致して利益がゼロになる売上高である。',correct:true,principle:'費用は売上に応じて変動する変動費と、一定範囲で発生する固定費に分けられる。',logic:'売上高から変動費を引いた限界利益で固定費をちょうど回収できる点で、利益はゼロになる。',case:'固定費30万円・限界利益率30%なら、損益分岐点売上高は100万円。',application:'販売単価、変動費率、固定費が変われば損益分岐点も変化する。'}];
const $=id=>document.getElementById(id);let history={};try{history=JSON.parse(localStorage.getItem('fe-knowledge-progress')||'{}')}catch{}let pool=[],position=0,current=null,answered=false;function save(){try{localStorage.setItem('fe-knowledge-progress',JSON.stringify(history))}catch{}}function filterPool(){const f=$('filter').value;pool=questions.filter(q=>f==='all'||(f==='wrong'?(history[q.term]?.wrong||0)>0:q.category===f));position=0;render()};function render(){current=pool[position%pool.length]||null;answered=false;$('details').classList.add('hidden');$('result').classList.add('hidden');$('next').disabled=true;document.querySelectorAll('#answers button').forEach(b=>b.disabled=!current);if(!current){$('term').textContent='復習する問題はまだありません';$('statement').textContent='ほかの分野を選んで問題に挑戦しよう。';$('category').textContent='問題なし'}else{$('term').textContent=current.term;$('statement').textContent=current.statement;$('category').textContent=current.label}const solved=Object.values(history).reduce((s,x)=>s+x.total,0),ok=Object.values(history).reduce((s,x)=>s+x.ok,0);$('stats').textContent=`累計 ${ok}/${solved} 正解`};function explanation(q){return `【原理・原則】\n${q.principle}\n\n【因果関係・理屈】\n${q.logic}\n\n【ケーススタディ】\n${q.case}\n\n【応用・条件変化】\n${q.application}`};function question(q){return `【${q.term}】\n${q.statement}`};function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}async function copy(s){try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch{const e=document.createElement('textarea');e.value=s;document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('コピーしました')}catch{toast('コピーできませんでした')}e.remove()}}document.querySelectorAll('#answers button').forEach(b=>b.addEventListener('click',()=>{if(!current||answered)return;answered=true;const right=String(current.correct)===b.dataset.val;const v=history[current.term]||{total:0,ok:0,wrong:0};v.total++;if(right)v.ok++;else v.wrong++;history[current.term]=v;save();$('result').textContent=(right?'✅ 正解！':'❌ 不正解。')+` 正しい答えは「${current.correct?'○':'×'}」です。`; $('result').classList.remove('hidden');$('principle').textContent=current.principle;$('logic').textContent=current.logic;$('case').textContent=current.case;$('application').textContent=current.application;$('details').classList.remove('hidden');$('next').disabled=false;document.querySelectorAll('#answers button').forEach(el=>el.disabled=true);const solved=Object.values(history).reduce((s,x)=>s+x.total,0),ok=Object.values(history).reduce((s,x)=>s+x.ok,0);$('stats').textContent=`累計 ${ok}/${solved} 正解`;}));$('next').addEventListener('click',()=>{position++;render()});$('filter').addEventListener('change',filterPool);$('copyQuestion').addEventListener('click',()=>current&&copy(question(current)));$('copyExplain').addEventListener('click',()=>current&&copy(explanation(current)));$('copyAll').addEventListener('click',()=>current&&copy(`${question(current)}\n正答：${current.correct?'○':'×'}\n\n${explanation(current)}`));filterPool();</script></body></html>
